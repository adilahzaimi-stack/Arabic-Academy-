    // --- ENJIN AUDIO CERIA & SPEECH SYNTHESIS ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmTimer = null;
        this.isBgmPlaying = false;
        this.noteIndex = 0;
        this.volume = 0.4;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
            this.masterGain.connect(this.ctx.destination);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setVolume(val) {
        this.volume = val / 100;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
        }
      }

      startBgm() {
        this.initContext();
        if (!this.ctx || this.isBgmPlaying) return;
        this.isBgmPlaying = true;

        const melody = [
          { f: 523.25, d: 220 }, { f: 659.25, d: 220 }, { f: 783.99, d: 220 },
          { f: 880.00, d: 220 }, { f: 783.99, d: 220 }, { f: 659.25, d: 220 },
          { f: 523.25, d: 350 }, { f: 587.33, d: 220 }, { f: 659.25, d: 220 },
          { f: 698.46, d: 220 }, { f: 659.25, d: 220 }, { f: 587.33, d: 350 },
          { f: 659.25, d: 220 }, { f: 783.99, d: 220 }, { f: 880.00, d: 350 }
        ];

        const playNextStep = () => {
          if (!this.isBgmPlaying || !this.ctx) return;
          const note = melody[this.noteIndex % melody.length];
          this.noteIndex++;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + (note.d / 1000));

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start();
          osc.stop(this.ctx.currentTime + (note.d / 1000) + 0.05);

          this.bgmTimer = setTimeout(playNextStep, note.d + 30);
        };

        playNextStep();
      }

      stopBgm() {
        this.isBgmPlaying = false;
        if (this.bgmTimer) clearTimeout(this.bgmTimer);
      }

      playCorrectSFX() {
        this.initContext();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.1);
          gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + idx * 0.1 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.35);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.4);
        });
      }

      playWrongSFX() {
        this.initContext();
        if (!this.ctx) return;
        const notes = [392.00, 329.63];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.15);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.15 + 0.25);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(this.ctx.currentTime + idx * 0.15);
          osc.stop(this.ctx.currentTime + idx * 0.15 + 0.3);
        });
      }

      speakQuestion(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ar-SA';
          utterance.rate = 0.8;
          window.speechSynthesis.speak(utterance);
        }
      }
    }

      { ar: 'طَائِرٌ', my: 'Burung', category: 'haiwan' },
      { ar: 'سَمَكَةٌ', my: 'Ikan', category: 'haiwan' },
      { ar: 'بَقَرَةٌ', my: 'Lembu', category: 'haiwan' },
      { ar: 'غَنَمٌ', my: 'Kambing', category: 'haiwan' },
      { ar: 'حِصَانٌ', my: 'Kuda', category: 'haiwan' },
      { ar: 'فِيلٌ', my: 'Gajah', category: 'haiwan' },
      { ar: 'أَسَدٌ', my: 'Singa', category: 'haiwan' },
      { ar: 'نَمِرٌ', my: 'Harimau', category: 'haiwan' },
      { ar: 'قِرْدٌ', my: 'Monyet', category: 'haiwan' },
      { ar: 'تِمْسَاحٌ', my: 'Buaya', category: 'haiwan' },
      { ar: 'ثُعْبَانٌ', my: 'Ular', category: 'haiwan' }
    ];

    // --- GENERATOR SOALAN SILIBUS KSSR ---
    const generateQuestionsForGrade = (grade) => {
      const easy = [];
      const medium = [];
      const hard = [];

      const currBank = globalDictionary;
      const fallbackBank = currBank.length ? currBank : globalDictionary.slice(0, 10);

      for (let i = 1; i <= 30; i++) {
        const item = fallbackBank[(i - 1) % fallbackBank.length];
        easy.push({
          id: `g${grade}_e${i}`,
          type: 'mcq',
          title: `Soalan ${i}`,
          instruction: 'Apakah maksud perkataan Bahasa Arab di bawah?',
          question: item.ar,
          options: [item.my, 'Pilihan A', 'Pilihan B'].sort(() => Math.random() - 0.5),
          answer: item.my
        });
      }

      for (let i = 1; i <= 30; i++) {
        const item = fallbackBank[(i - 1) % fallbackBank.length];
        medium.push({
          id: `g${grade}_m${i}`,
          type: 'mcq',
          title: `Soalan ${i}`,
          instruction: 'Pilih terjemahan Bahasa Arab yang betul bagi perkataan ini:',
          question: `Terjemahan: ${item.my}`,
          arabicVoice: item.ar,
          options: [item.ar, 'مَاكِتٌ', 'كِتَابٌ'].sort(() => Math.random() - 0.5),
          answer: item.ar
        });
      }

      for (let i = 1; i <= 30; i++) {
        const item = fallbackBank[(i - 1) % fallbackBank.length];
        const missingChar = item.ar.charAt(0);
        hard.push({
          id: `g${grade}_h${i}`,
          type: 'fill_missing',
          title: `Soalan ${i}`,
          instruction: 'Lengkapkan huruf yang hilang bagi perkataan Arab ini:',
          question: item.ar,
          given: [missingChar, 'أ', 'ب', 'ت'].sort(() => Math.random() - 0.5),
          display: `_ ${item.ar.slice(1)}`,
          answer: missingChar
        });
      }

      return { easy, medium, hard };
    };

    const exercisesData = {
      1: generateQuestionsForGrade(1),
      2: generateQuestionsForGrade(2),
      3: generateQuestionsForGrade(3),
      4: generateQuestionsForGrade(4),
      5: generateQuestionsForGrade(5),
      6: generateQuestionsForGrade(6)
    };

    // --- MAIN APP COMPONENT ---

      const [inputEmail, setInputEmail] = useState('');

      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      const [currentScreen, setCurrentScreen] = useState('dashboard'); 
      const [selectedGrade, setSelectedGrade] = useState(1);
      const [selectedDifficulty, setSelectedDifficulty] = useState(null);
      const [selectedDuration, setSelectedDuration] = useState(180); 
      const [volume, setVolume] = useState(40);
      const [isMusicOn, setIsMusicOn] = useState(true);

      const [leaderboard, setLeaderboard] = useState(() => {
        const saved = localStorage.getItem('arabic_academy_leaderboard');
        return saved ? JSON.parse(saved) : [
          { name: 'Ahmad', avatar: 'dragon', xp: 240, stars: 20 },
          { name: 'Siti', avatar: 'cat', xp: 180, stars: 14 },
          { name: 'Ali', avatar: 'frog', xp: 90, stars: 8 }
        ];
      });

      useEffect(() => {
        const currentEmail = localStorage.getItem('arabic_academy_active_email');
        if (currentEmail) {
          const accounts = JSON.parse(localStorage.getItem('arabic_academy_accounts') || '{}');
          if (accounts[currentEmail]) {
            setLoggedInEmail(currentEmail);
            if (!accounts[currentEmail].name) {
              setAuthMode('profile_name');
            } else {
              setUser(accounts[currentEmail]);
            }
          }
        }
      }, []);

      useEffect(() => {
        const handleInteraction = () => {
          if (isMusicOn) {
            soundFX.startBgm();
          }
          window.removeEventListener('click', handleInteraction);
        };
        window.addEventListener('click', handleInteraction);
        return () => window.removeEventListener('click', handleInteraction);
      }, [isMusicOn]);

      const saveProgress = (newXp, newStars) => {
        if (!user || !loggedInEmail) return;
        const totalCompleted = (user.completedQuestions || 0) + 1;
        const totalQuestions = 180; 
        const progressPercentage = Math.min(100, Math.round((totalCompleted / totalQuestions) * 100));

        const updatedUser = {
          ...user,
          xp: user.xp + newXp,
          stars: user.stars + newStars,
          completedQuestions: totalCompleted,
          progressPercentage: progressPercentage
        };

        setUser(updatedUser);

        const accounts = JSON.parse(localStorage.getItem('arabic_academy_accounts') || '{}');
        accounts[loggedInEmail] = updatedUser;
        localStorage.setItem('arabic_academy_accounts', JSON.stringify(accounts));

        setLeaderboard(prev => {
          const existingIdx = prev.findIndex(item => item.name.toLowerCase() === updatedUser.name.toLowerCase());
          let newList = [...prev];
          if (existingIdx >= 0) {
            newList[existingIdx] = { 
              name: updatedUser.name, 
              avatar: updatedUser.avatar || 'cat', 
              xp: updatedUser.xp, 
              stars: updatedUser.stars 
            };
          } else {
            newList.push({ 
              name: updatedUser.name, 
              avatar: updatedUser.avatar || 'cat', 
              xp: updatedUser.xp, 
              stars: updatedUser.stars 
            });
          }
          newList.sort((a, b) => b.xp - a.xp);
          localStorage.setItem('arabic_academy_leaderboard', JSON.stringify(newList));
          return newList;
        });
      };

      const handleAuthLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        const accounts = JSON.parse(localStorage.getItem('arabic_academy_accounts') || '{}');
        const emailKey = inputEmail.trim().toLowerCase();

        if (!accounts[emailKey]) {
          setAuthError('Akaun dengan emel ini belum berdaftar!');
          return;
        }

        if (accounts[emailKey].password !== inputPassword) {
          setAuthError('Kata laluan tidak tepat!');
          return;
        }

        localStorage.setItem('arabic_academy_active_email', emailKey);
        setLoggedInEmail(emailKey);

        if (!accounts[emailKey].name) {
          setAuthMode('profile_name');
        } else {
          setUser(accounts[emailKey]);
          soundFX.startBgm();
          setIsMusicOn(true);
        }
      };

      const handleAuthRegister = (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        const emailKey = inputEmail.trim().toLowerCase();
        const accounts = JSON.parse(localStorage.getItem('arabic_academy_accounts') || '{}');

        if (accounts[emailKey]) {
          setAuthError('Emel ini telah berdaftar. Sila log masuk.');
          return;
        }

        accounts[emailKey] = {
          email: emailKey,
          password: inputPassword,
          name: '',
          avatar: selectedAvatar,
          xp: 0,
          stars: 0,
          completedQuestions: 0,
          progressPercentage: 0
        };

        localStorage.setItem('arabic_academy_accounts', JSON.stringify(accounts));
        localStorage.setItem('arabic_academy_active_email', emailKey);
        setLoggedInEmail(emailKey);
        setAuthMode('profile_name');
      };

      const handleAuthForgot = (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        const emailKey = inputEmail.trim().toLowerCase();
        const accounts = JSON.parse(localStorage.getItem('arabic_academy_accounts') || '{}');

        if (!accounts[emailKey]) {
          setAuthError('Emel ini tiada dalam rekod sistem.');
          return;

        setAuthSuccess(`Pautan tetapan semula telah dihantar ke emel ${emailKey}. (Kata laluan semasa: ${accounts[emailKey].password})`);
      };

      const handleSaveProfileName = (e) => {

        if (!inputName.trim()) return;

          xp: 0,
          stars: 0,
          completedQuestions: 0,
          progressPercentage: 0

        activeUser.avatar = selectedAvatar;

        localStorage.setItem('arabic_academy_accounts', JSON.stringify(accounts));

        setUser(activeUser);

        const existingLeader = leaderboard.find(l => l.name.toLowerCase() === activeUser.name.toLowerCase());
        if (!existingLeader) {
          const newList = [...leaderboard, { 
            name: activeUser.name, 
            avatar: activeUser.avatar, 
            xp: activeUser.xp, 
            stars: activeUser.stars 
          }].sort((a, b) => b.xp - a.xp);
          setLeaderboard(newList);
          localStorage.setItem('arabic_academy_leaderboard', JSON.stringify(newList));
        }

        soundFX.startBgm();

      };

        setInputEmail('');

        setInputName('');
      };

      const handleVolumeChange = (e) => {
        const val = Number(e.target.value);

    // --- EXERCISE VIEW ---
    function ExerciseView({ grade, difficulty, durationSeconds, onBack, onComplete }) {
      const gradeQuestions = exercisesData[grade] || exercisesData[1];
      const questions = gradeQuestions[difficulty] || gradeQuestions.easy;

      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedAns, setSelectedAns] = useState(null);
      const [isCorrect, setIsCorrect] = useState(null);
      const [totalTimeLeft, setTotalTimeLeft] = useState(durationSeconds || 180); 
      const [isGameOver, setIsGameOver] = useState(false);
      const [scoreCount, setScoreCount] = useState(0);
      const [shake, setShake] = useState(false);

      const q = questions[currentIndex] || questions[0];

      const playQuestionVoice = () => {
        if (!q) return;
        const textToSpeak = q.arabicVoice || (q.type === 'mcq' && q.question.length > 1 ? q.question : q.title);
        soundFX.speakQuestion(textToSpeak);
      };

      useEffect(() => {
        playQuestionVoice();
        const timer = setInterval(() => {
          setTotalTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setIsGameOver(true);
              soundFX.playWrongSFX();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!isGameOver) {
          playQuestionVoice();
        }
      }, [currentIndex]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      const handleCheck = () => {
        if (!selectedAns || isGameOver) return;
        let correct = (selectedAns === q.answer);

        if (correct) {
          setIsCorrect(true);
          setScoreCount(prev => prev + 1);
          soundFX.playCorrectSFX();
          if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 50 });
          onComplete(20, 1);
        } else {
          setIsCorrect(false);
          soundFX.playWrongSFX();
          setShake(true);
          setTimeout(() => setShake(false), 500);
        }
      };

      const handleNext = () => {
        setIsCorrect(null);
        setSelectedAns(null);
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsGameOver(true);
        }
      };

      if (isGameOver) {
        return (
          <div className="max-w-md mx-auto bg-white rounded-3xl shadow-2xl p-8 text-center space-y-6 border border-gray-100">
            <div className="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
              <i className="fa-solid fa-trophy"></i>
            </div>
            <div>
              <h2 className="text-3xl font-bold text-gray-800">Latihan Tamat!</h2>
              <p className="text-sm text-gray-500 mt-1">Masa latihan telah tamat / Selesai.</p>
            </div>
            <div className="bg-teal-50 p-4 rounded-2xl border border-teal-100 space-y-2">
              <p className="text-gray-600 text-sm font-bold">Skor Anda:</p>
              <p className="text-4xl font-bold text-brand-teal">{scoreCount} / {questions.length}</p>
            </div>
            <button
              onClick={onBack}
              className="w-full bg-brand-teal text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-teal-600 transition"
            >
              Kembali ke Menu Tahap
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-8 border border-gray-100 relative">
          <div className="flex justify-between items-center border-b pb-4 mb-6">
            <button onClick={onBack} className="text-gray-400 hover:text-gray-600 font-bold flex items-center gap-2">
              <i className="fa-solid fa-arrow-left"></i> Keluar
            </button>
            <div className="flex items-center gap-4">
              <div className={`flex items-center gap-2 font-bold px-4 py-1.5 rounded-full text-sm ${totalTimeLeft < 30 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-amber-100 text-amber-700'}`}>
                <i className="fa-solid fa-clock"></i>
                <span>Baki Masa: {formatTime(totalTimeLeft)}</span>
              </div>
              <span className="text-xs text-gray-400 font-bold">Soalan {currentIndex + 1}/30</span>
            </div>
          </div>

          <div className={`space-y-6 ${shake ? 'shake' : ''}`}>
            <div className="flex justify-between items-start">
              <div>
                <h3 className="text-xl font-bold text-gray-800">{q.title}</h3>
                <p className="text-sm text-gray-500 mt-1">{q.instruction}</p>
              </div>

              <button 
                onClick={playQuestionVoice}
                className="bg-teal-50 hover:bg-brand-teal hover:text-white text-brand-teal p-3 rounded-2xl transition flex items-center gap-2 shadow-sm shrink-0"
                title="Dengar Sebutan Soalan"
              >
                <i className="fa-solid fa-volume-high text-xl"></i>
                <span className="text-xs font-bold hidden sm:inline">Dengar Soalan</span>
              </button>
            </div>

            {q.type === 'mcq' && (
              <div className="text-center py-6">
                <div className="arabic-text text-5xl font-bold text-brand-teal mb-6 bg-teal-50/50 py-6 rounded-3xl border border-teal-100">
                  {q.question}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {q.options.map((opt, idx) => (
                    <button
                      key={idx}
                      onClick={() => setSelectedAns(opt)}
                      className={`p-4 rounded-2xl font-bold text-lg border-2 transition ${
                        selectedAns === opt 
                          ? 'border-brand-teal bg-teal-50 text-brand-teal shadow-md' 
                          : 'border-gray-200 text-gray-700 hover:border-gray-300'
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {q.type === 'fill_missing' && (
              <div className="text-center py-6 space-y-6">
                <div className="arabic-text text-5xl font-bold text-gray-800 bg-gray-50 p-6 rounded-2xl inline-block border">
                  {q.display.replace('_', selectedAns || '_')}
                </div>

                <div className="flex justify-center gap-4">
                  {q.given.map((char, idx) => (
                    <button
                      key={idx}
                      onClick={() => setSelectedAns(char)}
                      className="arabic-text text-2xl font-bold w-14 h-14 rounded-2xl border-2 border-brand-teal text-brand-teal hover:bg-teal-50 transition"
                    >
                      {char}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {isCorrect === true && (
              <div className="bg-emerald-50 text-emerald-700 p-4 rounded-2xl font-bold text-center">
                Jawapan Betul! 🎉 +20 XP
              </div>
            )}
            {isCorrect === false && (
              <div className="bg-rose-50 text-rose-700 p-4 rounded-2xl font-bold text-center">
                Jawapan Salah! Cuba Lagi 💪
              </div>
            )}

            <div className="pt-4">
              {isCorrect === null ? (
                <button
                  onClick={handleCheck}
                  className="w-full bg-brand-teal text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-teal-600 transition"
                >
                  Semak Jawapan
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="w-full bg-brand-yellow text-gray-900 font-bold py-4 rounded-2xl shadow-lg hover:bg-yellow-400 transition"
                >
                  Seterusnya ({currentIndex + 1}/30)
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

      const categories = [
        { id: 'all', label: 'Semua Kategori', icon: 'fa-layer-group' },
        { id: 'pengenalan', label: 'Kata-kata Pengenalan', icon: 'fa-comments' },
        { id: 'nombor', label: 'Nombor (1 - 100)', icon: 'fa-arrow-1-9' },
        { id: 'bulan', label: 'Bulan (Hijri & Miladi)', icon: 'fa-calendar-days' },
        { id: 'alatan_kelas', label: 'Alatan Kelas', icon: 'fa-chalkboard-user' },
        { id: 'warna', label: 'Warna', icon: 'fa-palette' },
        { id: 'alatan_rumah', label: 'Alatan Rumah', icon: 'fa-house-user' },
        { id: 'tempat_sekolah', label: 'Tempat di Sekolah', icon: 'fa-school' },
        { id: 'sukan', label: 'Jenis Sukan', icon: 'fa-football' },
        { id: 'cita_cita', label: 'Cita-cita Saya', icon: 'fa-user-tie' },
        { id: 'alatan_tandas', label: 'Peralatan Tandas', icon: 'fa-soap' },
        { id: 'kenderaan', label: 'Kenderaan', icon: 'fa-car' },
        { id: 'keluarga', label: 'Ahli Keluarga', icon: 'fa-people-roof' },
        { id: 'badan', label: 'Anggota Badan', icon: 'fa-child' },
        { id: 'alatan_belajar', label: 'Alatan Belajar', icon: 'fa-pen-ruler' },
        { id: 'pakaian', label: 'Pakaian', icon: 'fa-shirt' },
        { id: 'makanan', label: 'Makanan & Minuman', icon: 'fa-utensils' },
        { id: 'hari', label: 'Hari', icon: 'fa-calendar-day' },
        { id: 'alatan_dapur', label: 'Alatan di Dapur', icon: 'fa-kitchen-set' },
        { id: 'haiwan', label: 'Haiwan', icon: 'fa-paw' }
      ];

      const filteredWords = globalDictionary.filter(item => {
        const matchesSearch = item.ar.includes(searchTerm) || item.my.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="flex justify-between items-center">
            <button onClick={onBack} className="text-gray-400 hover:text-gray-600 font-bold flex items-center gap-2">
              <i className="fa-solid fa-arrow-left"></i> Kembali
            </button>
            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
              <i className="fa-solid fa-book-bookmark text-brand-teal"></i> Kamus KSSR Bahasa Arab
            </h2>
          </div>

          <div className="bg-white rounded-3xl p-6 shadow-md border border-gray-100 space-y-4">
            <div className="relative">
              <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input 
                type="text"
                placeholder="Cari perkataan Arab atau Melayu..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full pl-12 pr-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 focus:outline-none focus:border-brand-teal font-semibold text-gray-700"
              />
            </div>

            <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
              {categories.map((cat) => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={`px-4 py-2 rounded-xl font-bold text-xs whitespace-nowrap transition flex items-center gap-2 border shrink-0 ${
                    selectedCategory === cat.id
                      ? 'bg-brand-teal text-white border-brand-teal shadow-md'
                      : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                  }`}
                >
                  <i className={`fa-solid ${cat.icon}`}></i>
                  {cat.label}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredWords.map((word, idx) => {
              const catObj = categories.find(c => c.id === word.category);
              return (
                <div key={idx} className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex justify-between items-center hover:shadow-md transition">
                  <div className="space-y-1">
                    <span className="bg-teal-50 text-brand-teal text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-teal-100 flex items-center gap-1 w-max">
                      <i className={`fa-solid ${catObj ? catObj.icon : 'fa-tag'}`}></i>
                      {catObj ? catObj.label : 'KSSR'}
                    </span>
                    <p className="text-lg font-bold text-gray-800">{word.my}</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="arabic-text text-3xl font-bold text-brand-teal">{word.ar}</span>
                    <button 
                      onClick={() => soundFX.speakQuestion(word.ar)}
                      className="w-10 h-10 bg-gray-100 hover:bg-brand-teal hover:text-white rounded-xl flex items-center justify-center text-gray-600 transition shrink-0"
                      title="Sebut Perkataan"
                    >
                      <i className="fa-solid fa-volume-high"></i>
                    </button>
                  </div>
                </div>
              );
            })}

            {filteredWords.length === 0 && (
              <div className="col-span-full text-center py-12 bg-white rounded-3xl text-gray-400">
                <i className="fa-solid fa-circle-exclamation text-4xl mb-2"></i>
                <p className="font-bold">Tiada perkataan ditemui.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- LEADERBOARD VIEW ---
    function LeaderboardView({ leaderboard, onBack }) {
      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="flex justify-between items-center">
            <button onClick={onBack} className="text-gray-400 hover:text-gray-600 font-bold flex items-center gap-2">
              <i className="fa-solid fa-arrow-left"></i> Kembali
            </button>
            <h2 className="text-2xl font-bold text-gray-800">Kedudukan & Pencapaian</h2>
          </div>

          <div className="bg-white rounded-3xl shadow-md border border-gray-100 overflow-hidden">
            <div className="bg-brand-teal text-white p-4 font-bold flex justify-between items-center">
              <span>Kedudukan Murid</span>
              <span>XP / Bintang</span>
            </div>
            <div className="divide-y divide-gray-100">
              {leaderboard.map((item, index) => {
                const av = CARTOON_AVATARS.find(a => a.id === item.avatar) || CARTOON_AVATARS[0];
                return (
                  <div key={index} className="p-4 flex items-center justify-between hover:bg-gray-50 transition">
                    <div className="flex items-center gap-3">
                      <span className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                        index === 0 ? 'bg-amber-400 text-white' : index === 1 ? 'bg-gray-300 text-white' : index === 2 ? 'bg-amber-600 text-white' : 'bg-gray-100 text-gray-600'
                      }`}>
                        {index + 1}
                      </span>
                      <div className={`w-10 h-10 ${av.bg} text-white rounded-xl flex items-center justify-center shadow`}>
                        <i className={`fa-solid ${av.icon}`}></i>
                      </div>
                      <div>
                        <h4 className="font-bold text-gray-800">{item.name}</h4>
                        <p className="text-[10px] text-gray-400">Kartun: {av.name}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-4">
                      <div className="text-right">
                        <span className="font-extrabold text-brand-teal">{item.xp} XP</span>
                        <div className="text-xs font-bold text-amber-500">★ {item.stars}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
